networks:
  opencollective-dev:
    driver: bridge
  traefik-dev:
    external: true

services:
  frontend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platform: linux/amd64
    container_name: opencollective-frontend-dev
    restart: unless-stopped
    networks:
      - opencollective-dev
      - traefik-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      OC_ENV: development
      API_URL: http://opencollective-api:3060
      INTERNAL_API_URL: http://opencollective-api:3060
      IMAGES_URL: http://opencollective-api:9000
      PDF_SERVICE_V2_URL: http://pdf-service:3002
      ML_SERVICE_URL: http://ml-service:8000
      API_KEY: your_api_key_here
      TRAEFIK_DOMAIN: ${FRONTEND_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-dev.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend-dev.entrypoints=websecure"
      - "traefik.http.routers.frontend-dev.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-dev.loadbalancer.server.port=3000"
    volumes:
      - .:/usr/src/frontend
      - /usr/src/frontend/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s